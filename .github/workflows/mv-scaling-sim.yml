name: mv-scaling-sim

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  simulation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-10-10

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mv-scaling-sim

      - name: Run tiered DB simulation smoke test
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo test -p risingwave_simulation --test integration_tests test_cdp_segment_tiers_smoke

      - name: Run sparse-commit simulation smoke test
        env:
          RUST_BACKTRACE: 1
          RW_ENABLE_SPARSE_TABLES_TO_COMMIT: "1"
        run: |
          cargo test -p risingwave_simulation --test integration_tests test_sparse_commit_dirty_tables_smoke
